[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "app-process-lifecycle"
version = "0.1.0"
description = "Detached shutdown watchdog and process-pool helpers for GUI apps"
readme = "README.md"
license = { text = "LGPL-3.0-or-later" }
requires-python = ">=3.8"
authors = [{ name = "bodencrouch" }]
dependencies = [

]

[project.urls]
Homepage = "https://github.com/bodencrouch/app-process-lifecycle"
Repository = "https://github.com/bodencrouch/app-process-lifecycle"

[tool.setuptools.packages.find]
where = ["src"]
